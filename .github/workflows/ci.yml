name: CI

on:
  push:
  pull_request:

jobs:
  standalone-cross-root-retention-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Qualify synthetic cross-root retention on Windows PowerShell 5.1
        shell: powershell
        run: |
          $root = Join-Path $PWD 'deployments/symcon/windows'
          $consumer = Join-Path $root 'Invoke-SaefStandaloneModuleCrossRootRetention.ps1'
          $child = Join-Path $root 'SaefChildProcess.ps1'
          $qualification = Join-Path $root 'Invoke-SaefStandaloneModuleCrossRootRetentionWindowsQualification.ps1'
          $status = Join-Path $env:RUNNER_TEMP 'cross-root-retention-qualification.local.json'
          & $qualification -RetentionScriptPath $consumer -ExpectedRetentionScriptSha256 (Get-FileHash $consumer).Hash.ToLowerInvariant() -ChildProcessContractPath $child -ExpectedChildProcessContractSha256 (Get-FileHash $child).Hash.ToLowerInvariant() -StatusPath $status
          $qualificationExit = $LASTEXITCODE
          Get-Content -LiteralPath $status -Raw
          exit $qualificationExit

  scope-bound-approval-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [saef-owntracks-position-map, saef-media-carousel]
    steps:
      - uses: actions/checkout@v6
      - name: Qualify isolated approval runner and profile installer
        shell: powershell
        run: ./tests/deployments/scope-bound-approval-native.ps1 -TargetId '${{ matrix.target }}'

  channel-target-addition-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Qualify additive channel maintenance on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/deployments/channel-target-addition.ps1
      - name: Qualify compatible OwnTracks and explicit MediaCarousel state provisioning
        shell: powershell
        run: ./tests/deployments/adapter-state-profiles.ps1
      - name: Qualify complete MediaCarousel target installation without live RPC
        shell: powershell
        run: ./tests/deployments/media-carousel-target-installation.ps1
      - name: Qualify atomic MediaCarousel binding generation without live RPC
        shell: powershell
        run: ./tests/deployments/media-carousel-binding-update.ps1
      - name: Qualify atomic MediaCarousel approval bootstrap without live RPC
        shell: powershell
        run: ./tests/deployments/media-carousel-bootstrap.ps1

  media-carousel-schema-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Qualify complete installed MediaCarousel approval pipeline with loopback RPC
        shell: powershell
        run: |
          & ./tests/deployments/media-carousel-fit-transaction.ps1 -ApprovalPipeline
          $qualificationExit = $LASTEXITCODE
          Get-Content ./tests/deployments/media-carousel-windows-qualification-status.local.json
          exit $qualificationExit
      - name: Qualify MediaCarousel schema transition on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/deployments/media-carousel-fit-schema.ps1
      - name: Qualify durable MediaCarousel recovery state
        shell: powershell
        run: ./tests/deployments/media-carousel-recovery-state.ps1
      - name: Qualify target-bound reseal and preserved configuration baseline
        shell: powershell
        run: ./tests/deployments/media-carousel-reseal-contract.ps1
      - name: Qualify actual MediaCarousel reseal and consecutive baseline advances
        shell: powershell
        run: ./tests/deployments/media-carousel-reseal-transaction.ps1
      - name: Qualify isolated schema probe without live Symcon
        shell: powershell
        run: ./tests/deployments/media-carousel-schema-probe.ps1
      - name: Qualify real adapter transactions against synthetic loopback RPC
        shell: powershell
        run: |
          & ./tests/deployments/media-carousel-fit-transaction.ps1
          $qualificationExit = $LASTEXITCODE
          Get-Content ./tests/deployments/media-carousel-windows-qualification-status.local.json
          exit $qualificationExit

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test case-studies/media-carousel/tests/client-state.test.cjs

      - run: composer install

      - run: composer check
