name: CI

on:
  push:
  pull_request:

jobs:
  channel-target-addition-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Qualify additive channel maintenance on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/deployments/channel-target-addition.ps1
      - name: Qualify compatible OwnTracks and explicit MediaCarousel state provisioning
        shell: powershell
        run: ./tests/deployments/adapter-state-profiles.ps1
      - name: Qualify complete MediaCarousel target installation without live RPC
        shell: powershell
        run: ./tests/deployments/media-carousel-target-installation.ps1
      - name: Qualify atomic MediaCarousel binding generation without live RPC
        shell: powershell
        run: ./tests/deployments/media-carousel-binding-update.ps1

  media-carousel-schema-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Qualify MediaCarousel schema transition on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/deployments/media-carousel-fit-schema.ps1
      - name: Qualify durable MediaCarousel recovery state
        shell: powershell
        run: ./tests/deployments/media-carousel-recovery-state.ps1
      - name: Qualify isolated schema probe without live Symcon
        shell: powershell
        run: ./tests/deployments/media-carousel-schema-probe.ps1
      - name: Qualify real adapter transactions against synthetic loopback RPC
        shell: powershell
        run: |
          & ./tests/deployments/media-carousel-fit-transaction.ps1
          $qualificationExit = $LASTEXITCODE
          Get-Content ./tests/deployments/media-carousel-windows-qualification-status.local.json
          exit $qualificationExit

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test case-studies/media-carousel/tests/client-state.test.cjs

      - run: composer install

      - run: composer check
