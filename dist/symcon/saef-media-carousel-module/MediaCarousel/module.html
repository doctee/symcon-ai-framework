<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root {
            --fit-mode: cover;
            --transition-ms: 320ms;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #2f3035;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #carousel {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: pan-y;
            outline: none;
        }

        #track {
            display: flex;
            width: 300%;
            height: 100%;
            will-change: transform;
        }

        .slide {
            flex: 0 0 33.333333%;
            width: 33.333333%;
            height: 100%;
            overflow: hidden;
            background: #2f3035;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: var(--fit-mode);
            pointer-events: none;
        }

        .slide img[hidden] {
            display: none;
        }

        #title {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            padding: 12px 58px 28px 16px;
            overflow: hidden;
            color: #fff;
            font-size: clamp(14px, 2.2vw, 20px);
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 4px #000, 0 1px 10px #000;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.58), transparent);
            pointer-events: none;
        }

        .arrow {
            position: absolute;
            top: 50%;
            z-index: 6;
            width: clamp(36px, 8vw, 48px);
            height: clamp(44px, 20vh, 72px);
            transform: translateY(-50%);
            padding: 0;
            border: 0;
            border-radius: 0 12px 12px 0;
            color: #fff;
            background: rgba(0, 0, 0, 0.24);
            font-size: clamp(28px, 7vw, 40px);
            line-height: 1;
            cursor: pointer;
            opacity: 0.72;
            transition: background 120ms ease, opacity 120ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .arrow:hover,
        .arrow:focus-visible {
            background: rgba(0, 0, 0, 0.52);
            opacity: 1;
        }

        #previous {
            left: 0;
        }

        #next {
            right: 0;
            border-radius: 12px 0 0 12px;
        }

        #position {
            position: absolute;
            left: 50%;
            bottom: 12px;
            z-index: 7;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: calc(100% - 120px);
            padding: 7px 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.42);
            transform: translateX(-50%);
            pointer-events: none;
        }

        #fitToggle {
            position: absolute;
            right: 4px;
            bottom: 4px;
            z-index: 8;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            color: #fff;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #fitToggle svg {
            width: 28px;
            height: 28px;
            padding: 5px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.42);
            pointer-events: none;
        }

        #fitToggle:focus-visible {
            outline: 2px solid var(--accent-color, #20cdbb);
            outline-offset: -3px;
        }

        #fitToggle[hidden],
        #fitToggle[data-fit="cover"] .fill-icon,
        #fitToggle[data-fit="contain"] .fit-icon {
            display: none;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
        }

        .dot.current {
            width: 9px;
            height: 9px;
            background: #fff;
        }

        #loading,
        #message {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: rgba(255, 255, 255, 0.9);
            background: #2f3035;
            text-align: center;
            pointer-events: none;
        }

        #loading[hidden],
        #message[hidden] {
            display: none;
        }

        #loading::before {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--accent-color, #20cdbb);
            border-radius: 50%;
            content: "";
            animation: spin 900ms linear infinite;
        }

        #toast {
            position: absolute;
            left: 50%;
            bottom: 56px;
            z-index: 8;
            max-width: calc(100% - 40px);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(120, 24, 24, 0.9);
            color: #fff;
            text-align: center;
            transform: translateX(-50%);
            pointer-events: none;
        }

        #toast[hidden] {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                --transition-ms: 1ms;
            }
        }
    </style>
</head>
<body>
    <main id="carousel" tabindex="0" aria-live="polite">
        <div id="track">
            <div class="slide"><img id="previousImage" alt="" hidden></div>
            <div class="slide"><img id="currentImage" alt="" hidden></div>
            <div class="slide"><img id="nextImage" alt="" hidden></div>
        </div>
        <div id="title" hidden></div>
        <button id="previous" class="arrow" type="button" aria-label="Previous image">&#8249;</button>
        <button id="next" class="arrow" type="button" aria-label="Next image">&#8250;</button>
        <div id="position" aria-hidden="true" hidden></div>
        <button id="fitToggle" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="fit-icon" d="M3 9h6V3M9 9 3 3M21 9h-6V3M15 9l6-6M3 15h6v6M9 15l-6 6M21 15h-6v6M15 15l6 6"/>
                <path class="fill-icon" d="M3 9V3h6M3 3l6 6M21 9V3h-6M21 3l-6 6M3 15v6h6M3 21l6-6M21 15v6h-6M21 21l-6-6"/>
            </svg>
        </button>
        <div id="loading" aria-label="Loading image"></div>
        <div id="message" hidden></div>
        <div id="toast" role="status" hidden></div>
    </main>
    <script>
        /* SAEF_MEDIA_CAROUSEL_SCRIPT */
    </script>
</body>
</html>
